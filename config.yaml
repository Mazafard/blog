outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Personal blog by Maza Fard on engineering, entrepreneurship, and life in Portugal"
  author: "Maza Fard"
  # author: ["Me", "You"] # multiple authors

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  comments: true
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: false
    title: PaperMod
    imageUrl: "#"
    imageTitle: my image
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "Notes, systems, and the occasional life experiment"
    Content: >

      👋 This is my personal space for code, tooling, and the messy reality of building while living abroad.

      - I write about software engineering, product thinking, and the systems that make work easier.

      - I also keep notes on migration, entrepreneurship, and the lessons that come from starting over.

      - If you like practical writing and honest observations, you’re in the right place.

  socialIcons:
    - name: github
      title: View My Github
      url: "https://github.com/mazafard"
    - name: X
      title: Share PaperMod on X/Twitter
      url: "https://x.com/mazafard"
    - name: Instagram
      title: Buy me a Ko-Fi :)
      url: "https://ko-fi.com/mazafard"
    - name: pgpkey
      title: Buy me a Ko-Fi :)
      url: "https://ko-fi.com/mazafard"
    - name: email
      title: Send me email
      url: "mailto:mazafard@gmail.com"
    - name: KoFi
      title: Buy me a Ko-Fi :)
      url: "https://ko-fi.com/mazafard"

